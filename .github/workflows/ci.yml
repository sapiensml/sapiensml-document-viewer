# Builds and tests every push to main and every pull request, and keeps the release packages for two weeks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # mvn verify (UI tests, UI build, Java tests, coverage gate), then the Linux and Windows packages
      - name: Build, test and package
        run: ./deploy/package.sh

      - name: Check the shell scripts parse
        run: for script in deploy/package.sh deploy/linux/*.sh deploy/local/*.sh; do bash -n "$script"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            target/sapiensml-document-viewer-*.tar.gz
            target/sapiensml-document-viewer-*-windows.zip
          if-no-files-found: error
          retention-days: 14
