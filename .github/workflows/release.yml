# Publishes a GitHub release when a version tag is pushed (for example v1.0.0, matching <version>1.0.0</version> in
# pom.xml). Attaches the Linux and Windows packages, a SHA256SUMS file, and signed build provenance that anyone can
# check with: gh attestation verify <package> --repo sapiensml/sapiensml-document-viewer
# Then publishes the Docker image ghcr.io/sapiensml/sapiensml-document-viewer (linux/amd64 and linux/arm64), tagged
# with the version, major.minor and latest, also with signed provenance:
# gh attestation verify oci://ghcr.io/sapiensml/sapiensml-document-viewer:<version> --repo sapiensml/sapiensml-document-viewer
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # create the release
      id-token: write          # sign the build provenance
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build, test and package
        run: ./deploy/package.sh

      - name: Check the tag matches the version
        run: |
          version=$(cat target/release/sapiensml-document-viewer-*/VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version in pom.xml"
            exit 1
          fi

      - name: Checksums
        run: |
          cd target
          sha256sum sapiensml-document-viewer-*.tar.gz sapiensml-document-viewer-*-windows.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/sapiensml-document-viewer-*.tar.gz
            target/sapiensml-document-viewer-*-windows.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "SapiensML Document Viewer ${GITHUB_REF_NAME#v}" \
            target/sapiensml-document-viewer-*.tar.gz target/sapiensml-document-viewer-*-windows.zip target/SHA256SUMS

  image:
    name: Publish the Docker image
    # Only after the release job has built and tested this tag
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      id-token: write          # sign the build provenance
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU runs the last Dockerfile stage for arm64; the Node and Maven stages run natively
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/sapiensml/sapiensml-document-viewer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/sapiensml/sapiensml-document-viewer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
