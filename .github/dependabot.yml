# Weekly dependency updates. Minor and patch updates are grouped into one pull request per ecosystem. New versions
# wait 14 days before Dependabot proposes them. Major versions of Maven and npm dependencies (Spring Boot, Vite,
# TypeScript, ...) are planned upgrades, so Dependabot doesn't propose them; security updates still arrive for any
# version, because ignore rules by update type apply to version updates only.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
