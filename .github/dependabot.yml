# Weekly dependency updates. Minor and patch updates are grouped into one pull request per ecosystem. New versions
# wait 14 days before Dependabot proposes them. Major versions of Maven and npm dependencies and of the Docker images
# (Spring Boot, Vite, TypeScript, Keycloak, ...) are planned upgrades, so Dependabot doesn't propose them; security
# updates still arrive for any version, because ignore rules by update type apply to version updates only.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The Dockerfile's base images and the quick start's Keycloak and BusyBox, pinned by digest. Dependabot misreads the
  # Maven and Temurin tags (it proposed Java 26 for the build and Alpine 3.20 for the runtime), so those two are
  # updated by hand with each quarterly Java security release: keep Java 21 and a supported Alpine.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      - dependency-name: maven
      - dependency-name: eclipse-temurin
    groups:
      docker-images:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      quick-start-images:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
