# nginx in front of the SapiensML Document Viewer: TLS, HTTP to HTTPS, rate limits, streaming without buffering.
# Written to /etc/nginx/conf.d/sapiensml-document-viewer.conf by "install.sh nginx"; the @...@ values are filled in.

limit_req_zone $binary_remote_addr zone=sapiensml_viewer:10m rate=30r/s;

upstream sapiensml_document_viewer {
    server 127.0.0.1:@PORT@;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @SERVER_NAME@;

    ssl_certificate @CERT@;
    ssl_certificate_key @KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sapiensml_viewer_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # Only sign-out posts anything
    client_max_body_size 64k;

    location / {
        # PDF.js reads a document in many small ranges: allow bursts
        limit_req zone=sapiensml_viewer burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://sapiensml_document_viewer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Correlation-Id $request_id;

        # Documents stream through as they arrive; nothing is written to disk here
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
